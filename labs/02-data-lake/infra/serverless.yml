# ================================================================
# Lab 2 · Infraestructura del Data Lake de PayTrack
#   S3 (raw / processed / curated) + Glue (catálogo, crawlers, job) + Athena
#
# Despliegue:  serverless deploy --stage dev
# Limpieza:    ver README (vaciar el bucket y luego serverless remove)
# ================================================================
service: paytrack-datalake
frameworkVersion: "3"

provider:
  name: aws
  region: ${env:AWS_DEFAULT_REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}

custom:
  studentId: ${env:STUDENT_ID}
  # El nombre de un bucket es único en todo AWS: lo hacemos único con tu id y tu cuenta
  bucketName: paytrack-datalake-${self:custom.studentId}-${aws:accountId}
  glueDatabase: paytrack_db

resources:
  Resources:
    # ── S3: el Data Lake ─────────────────────────────────────
    DataLakeBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.bucketName}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        LifecycleConfiguration:
          Rules:
            # Los resultados de Athena son temporales
            - Id: expire-athena-results
              Status: Enabled
              Prefix: athena-results/
              ExpirationInDays: 7
            # TODO: define una política de ciclo de vida para cada zona del lake.
            #   - raw/:       ¿cuánto tiempo se consulta? ¿cuándo pasarlo a una clase
            #                 de almacenamiento más barata (STANDARD_IA, GLACIER_IR)?
            #                 ¿se debe borrar alguna vez? (piensa en auditoría)
            #   - processed/: ¿cuándo deja de ser útil si siempre puedes regenerarlo desde raw?
            #   - curated/:   ¿qué tan frecuente es su acceso?
            # Usa Transitions (TransitionInDays + StorageClass) y/o ExpirationInDays.
            # Justifica cada valor en tu informe. Referencia:
            # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-s3-bucket-rule.html

    # ── Glue: catálogo de datos ──────────────────────────────
    GlueDatabase:
      Type: AWS::Glue::Database
      Properties:
        CatalogId: !Ref AWS::AccountId
        DatabaseInput:
          Name: ${self:custom.glueDatabase}
          Description: Catálogo del Data Lake de PayTrack

    GlueRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: glue.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
        Policies:
          - PolicyName: datalake-access
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
                  Resource:
                    - arn:aws:s3:::${self:custom.bucketName}
                    - arn:aws:s3:::${self:custom.bucketName}/*

    # Un crawler por zona: infieren el esquema y las particiones y crean
    # las tablas raw_* y processed_* en el catálogo
    RawCrawler:
      Type: AWS::Glue::Crawler
      Properties:
        Name: paytrack-raw-crawler
        Role: !GetAtt GlueRole.Arn
        DatabaseName: ${self:custom.glueDatabase}
        TablePrefix: raw_
        Targets:
          S3Targets:
            - Path: s3://${self:custom.bucketName}/raw/

    ProcessedCrawler:
      Type: AWS::Glue::Crawler
      Properties:
        Name: paytrack-processed-crawler
        Role: !GetAtt GlueRole.Arn
        DatabaseName: ${self:custom.glueDatabase}
        TablePrefix: processed_
        Targets:
          S3Targets:
            - Path: s3://${self:custom.bucketName}/processed/

    # Job ETL (Spark) que convierte raw (JSON) → processed (Parquet)
    RawToProcessedJob:
      Type: AWS::Glue::Job
      Properties:
        Name: paytrack-raw-to-processed
        Role: !GetAtt GlueRole.Arn
        GlueVersion: "4.0"
        WorkerType: G.1X
        NumberOfWorkers: 2
        Timeout: 15
        Command:
          Name: glueetl
          PythonVersion: "3"
          ScriptLocation: s3://${self:custom.bucketName}/scripts/raw_to_processed.py
        DefaultArguments:
          "--BUCKET": ${self:custom.bucketName}
          "--enable-continuous-cloudwatch-log": "true"

    # ── Athena ───────────────────────────────────────────────
    AthenaWorkGroup:
      Type: AWS::Athena::WorkGroup
      Properties:
        Name: paytrack-wg
        RecursiveDeleteOption: true
        WorkGroupConfiguration:
          EnforceWorkGroupConfiguration: true
          PublishCloudWatchMetricsEnabled: true
          ResultConfiguration:
            OutputLocation: s3://${self:custom.bucketName}/athena-results/

  Outputs:
    DataLakeBucket:
      Value: !Ref DataLakeBucket
