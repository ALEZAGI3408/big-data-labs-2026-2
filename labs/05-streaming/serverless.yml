# ================================================================
# Lab 5 · Pipeline de streaming de fraude de PayTrack
#   Kinesis Data Streams → Lambda → DynamoDB (alertas) + S3 (archivo) + SNS (email)
#
# Despliegue:  serverless deploy --stage dev --param="alertEmail=tu@correo.com"
# Limpieza:    ver README (vaciar el bucket y luego serverless remove)
# ================================================================
service: paytrack-streaming
frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  region: ${env:AWS_DEFAULT_REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  environment:
    ALERTS_TABLE: !Ref AlertsTable
    ARCHIVE_BUCKET: !Ref ArchiveBucket
    ALERT_TOPIC_ARN: !Ref AlertTopic
  iam:
    role:
      statements:
        - Effect: Allow
          Action: [dynamodb:PutItem, dynamodb:BatchWriteItem]
          Resource: !GetAtt AlertsTable.Arn
        - Effect: Allow
          Action: s3:PutObject
          Resource: !Join ["", [!GetAtt ArchiveBucket.Arn, "/*"]]
        - Effect: Allow
          Action: sns:Publish
          Resource: !Ref AlertTopic

package:
  patterns:
    - "!**"
    - functions/**
    - "!functions/__pycache__/**"

functions:
  fraudDetector:
    handler: functions/fraud_detector.handler
    name: paytrack-fraud-detector-${sls:stage}
    timeout: 30
    memorySize: 256
    events:
      - stream:
          type: kinesis
          arn: !GetAtt FraudStream.Arn
          startingPosition: LATEST
          batchSize: 100
          batchWindow: 5               # espera hasta 5 s para armar lotes más grandes
          maximumRetryAttempts: 2
          bisectBatchOnFunctionError: true

resources:
  Resources:
    FraudStream:
      Type: AWS::Kinesis::Stream
      Properties:
        Name: paytrack-fraud-stream-${sls:stage}
        ShardCount: 2
        RetentionPeriodHours: 24

    AlertsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: fraud-alerts-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: alert_id
            AttributeType: S
        KeySchema:
          - AttributeName: alert_id
            KeyType: HASH

    ArchiveBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: paytrack-stream-archive-${env:STUDENT_ID}-${aws:accountId}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    AlertTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: paytrack-fraud-alerts-${sls:stage}

    AlertEmailSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: !Ref AlertTopic
        Protocol: email
        Endpoint: ${param:alertEmail}

  Outputs:
    ArchiveBucket:
      Value: !Ref ArchiveBucket
